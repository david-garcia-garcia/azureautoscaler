trigger:
  branches:
    include:
      - '*'
  tags:
    include:
      - '*'
pr:
  branches:
    exclude:
      - '*'
resources:
- repo: self
variables:
  tag: '$(Build.BuildId)'
  vmImageName: 'windows-2022'
  AZP_AGENT_CLEANUP_PSMODULES_IN_POWERSHELL: "true"
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    timeoutInMinutes: 120
    displayName: Build
    pool:
      vmImage: $(vmImageName)
      name: Test-Rafael
    steps:
    - task: UseDotNet@2
      inputs:
        version: '8.0.x'
        includePreviewVersions: true # Required for .NET 8
    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '**/poolautoscaler.csproj'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        projects: '**/*tests.csproj'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'
        publishTestResults: true

    - pwsh: .\build.ps1
      name: build_images
      env:
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PWD: $(REGISTRY_PWD)
        REGISTRY_PATH: $(REGISTRY_PATH)
        IMAGE_NAME: azureautoscaler:$(Build.SourceBranchName)
        TEMP: $(Agent.TempDirectory)
        TESTS_SAS_URL: $(TESTS_SAS_URL)

    - pwsh: .\build.ps1 -Push
      name: push_containers
      # Only push if this is a tag, and the tests passed
      condition: or(and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), contains(variables['Build.SourceVersionMessage'], '[push]'))
      env:
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PWD: $(REGISTRY_PWD)
        REGISTRY_PATH: $(REGISTRY_PATH)
        IMAGE_NAME: azureautoscaler:$(Build.SourceBranchName)
